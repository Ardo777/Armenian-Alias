
spring.application.name=Armenian Alias

# Hosting platforms inject the port they expect us to listen on; 8080 locally.
server.port=${PORT:8080}
server.address=0.0.0.0

# Behind the platform's TLS proxy, so trust its forwarding headers — otherwise the
# WebSocket handshake is judged against the internal http:// origin instead of https://.
server.forward-headers-strategy=framework

# Phones on mobile networks drop idle sockets; keep the game connection alive.
server.tomcat.connection-timeout=60s

# Phones should always get the current build of the UI.
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
